name: cadence-cron

# Disparador externo da cadência da Lis, independente do scheduler do Lovable
# Cloud (que estava falhando). A cada ~5 min chama a Edge Function cadence-worker
# com {"action":"run"}. A própria função só age no horário útil (9h-17h, dias
# úteis, America/Sao_Paulo) e ignora o resto — então rodar 24/7 é seguro (no-op
# fora da janela). É idempotente: trava atômica evita envio duplicado se o cron
# oficial do Lovable voltar depois.
#
# Pré-requisitos:
# 1. Secret do repositório no GitHub: CADENCE_TRIGGER_TOKEN
#    (Settings -> Secrets and variables -> Actions -> New repository secret).
# 2. O MESMO valor setado como secret CADENCE_TRIGGER_TOKEN no Lovable Cloud,
#    e a função cadence-worker deployada (ela já aceita esse token).

on:
  schedule:
    - cron: '*/5 * * * *' # a cada 5 minutos (UTC); GitHub pode atrasar sob carga
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

concurrency:
  group: cadence-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar cadence-worker
        env:
          TOKEN: ${{ secrets.CADENCE_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CADENCE_TRIGGER_TOKEN não configurado no repositório. Abortando."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://emiupfzywiwtktoxfgeq.supabase.co/functions/v1/cadence-worker" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            -d '{"action":"run"}')
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          # 2xx = ok. 401 = token errado. Falha o job para aparecer vermelho no histórico.
          case "$code" in
            2*) exit 0 ;;
            *) echo "Chamada falhou (HTTP $code)"; exit 1 ;;
          esac
