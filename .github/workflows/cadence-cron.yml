name: cadence-cron

# Disparo MANUAL da cadência da Lis (aba Actions -> Run workflow). O agendamento
# oficial agora é o pg_cron do próprio Supabase (job lis-cadence-worker, migration
# 20261020000100_cron_sweeps.sql); este workflow fica só como contingência.
# A função só age no horário útil (9h-17h, dias úteis, America/Sao_Paulo) e é
# idempotente (trava atômica evita envio duplicado).
#
# Pré-requisitos para usar:
# 1. Secret do repositório no GitHub: CADENCE_TRIGGER_TOKEN
#    (Settings -> Secrets and variables -> Actions -> New repository secret).
# 2. O MESMO valor setado como secret CADENCE_TRIGGER_TOKEN no Supabase.

on:
  workflow_dispatch: {} # só manual; o agendamento é o pg_cron

concurrency:
  group: cadence-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar cadence-worker
        env:
          TOKEN: ${{ secrets.CADENCE_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CADENCE_TRIGGER_TOKEN não configurado no repositório. Abortando."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://emiupfzywiwtktoxfgeq.supabase.co/functions/v1/cadence-worker" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            -d '{"action":"run"}')
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          # 2xx = ok. 401 = token errado. Falha o job para aparecer vermelho no histórico.
          case "$code" in
            2*) exit 0 ;;
            *) echo "Chamada falhou (HTTP $code)"; exit 1 ;;
          esac
